<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="vh-100 d-flex justify-content-center align-items-center bg-white">

<div class="container card-container">
    <h3 class="text-center mb-4 text-dark fw-normal">Create Account</h3>
    <form action="/register" method="POST">
        <div class="mb-3">
            <input type="text" name="firstName" class="form-control rounded-pill px-3 py-2 bg-white" placeholder="First Name" required>
        </div>
        <div class="mb-3">
            <input type="text" name="lastName" class="form-control rounded-pill px-3 py-2 bg-white" placeholder="Last Name" required>
        </div>
        <div class="mb-3">
            <input type="email" name="email" class="form-control rounded-pill px-3 py-2 bg-white" placeholder="Email" required>
        </div>
        <div class="mb-3">
            <input type="password" name="password" class="form-control rounded-pill px-3 py-2 bg-white" placeholder="Password" required>
        </div>
        <div class="mb-3">
            <input type="password" name="confirmPassword" class="form-control rounded-pill px-3 py-2 bg-white" placeholder="Confirm Password" required>
        </div>

        <!-- todo -->
        <div class="mb-3 row align-items-center">
            <div class="col-6">
                <span class="text-muted small px-2">Solve: 7 + 4 = ?</span>
                <input type="hidden" name="captchaQuestion" value="7 + 4">
            </div>
            <div class="col-6">
                <input type="text" name="captchaAnswer" class="form-control rounded-pill px-3 py-2 bg-white" placeholder="Answer" required>
            </div>
        </div>

        <div class="row justify-content-center mt-4">
            <div class="col-6">
                <button type="submit" class="btn action-btn rounded-pill w-100 py-2">Register</button>
            </div>
        </div>
        <div class="text-center mt-3">
            <a href="index.html" class="text-muted text-decoration-none small">Back to Home</a>
        </div>
    </form>
</div>

</body>
</html>
