<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">

</head>
<body class="vh-100 d-flex justify-content-center align-items-center bg-white">

<div class="container card-container">
    <h3 class="text-center mb-4 text-dark fw-normal">Login</h3>
    <form>
        <div class="mb-3">
            <input type="email" class="form-control rounded-pill px-3 py-2 bg-white" placeholder="Email" required>
        </div>
        <div class="mb-3">
            <input type="password" class="form-control rounded-pill px-3 py-2 bg-white" placeholder="Password" required>
        </div>
        <div class="row justify-content-center mt-4">
            <div class=" col-6">
                <button type="submit" class="btn action-btn rounded-pill w-100 py-2">Sign In</button>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="index.html" class="action-btn px-3 py-2 rounded-pill text-muted text-decoration-none">Back to Home</a>
        </div>
    </form>
</div>

</body>
</html>
