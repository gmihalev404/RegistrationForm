<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="vh-100 d-flex justify-content-center align-items-center bg-white">

<div class="container card-container">
    <h3 class="text-center mb-4 text-dark fw-normal">Profile Settings</h3>

    {{ERROR_MESSAGE}}
    {{SUCCESS_MESSAGE}}

    <form action="/profile" method="POST">
        <div class="mb-3">
            <input type="text" name="firstName" value="{{FIRST_NAME}}" class="form-control rounded-pill px-3 py-2 bg-white" placeholder="First Name" required>
        </div>

        <div class="mb-3">
            <input type="text" name="lastName" value="{{LAST_NAME}}" class="form-control rounded-pill px-3 py-2 bg-white" placeholder="Last Name" required>
        </div>

        <hr class="my-4 text-muted">

        <div class="mb-3">
            <input type="password" name="currentPassword" class="form-control rounded-pill px-3 py-2 bg-white" placeholder="Current Password">
        </div>
        <div class="mb-3">
            <input type="password" name="newPassword" class="form-control rounded-pill px-3 py-2 bg-white" placeholder="New Password">
        </div>

        <div class="row justify-content-center mt-4">
            <div class="col-6">
                <button type="submit" class="btn action-btn rounded-pill w-100 py-2">Save Changes</button>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="/home" class="action-btn px-3 py-2 rounded-pill text-muted text-decoration-none">Back to Home</a>
        </div>
    </form>
</div>

</body>
</html>
